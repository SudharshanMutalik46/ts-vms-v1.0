groups:
- name: vms_latency_alerts
  rules:
  - alert: HighIngestLatency
    expr: vms_media_ingest_latency_ms > 300
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "High ingest latency for camera {{ $labels.camera_id }}"
      description: "Latency is {{ $value }}ms (Threshold 300ms). Check disk I/O or network."

  - alert: PipelineRestartLoop
    expr: rate(vms_media_restarts_total[5m]) > 0.2
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Pipeline restarting frequently: {{ $labels.camera_id }}"
      description: "Pipeline restarted more than once in 5 minutes."

  - alert: SFUHighViewerLoad
    expr: vms_sfu_viewers > 100
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "SFU Viewer count high ({{ $value }})"

  - alert: MetricsScrapeDown
    expr: vms_metrics_up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Component {{ $labels.component }} metrics down"
      description: "Collector failed to scrape {{ $labels.component }}."

  - alert: OldMetricsSnapshot
    expr: time() - vms_metrics_snapshot_age_seconds > 120
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "Metrics Snapshot is stale"
      description: "Data has not been updated in > 2 minutes."

  - alert: H265TranscodePoolFull
    expr: vms_webrtc_h265_active >= vms_webrtc_h265_capacity
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "H265 Transcode Pool Full"
      description: "H265 transcoding pool at capacity. New H265 viewers will fallback to H264."

  - alert: H265TranscodeStall
    expr: vms_media_ingest_fps{codec="H265"} == 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "H265 Transcode Stall for camera {{ $labels.camera_id }}"
      description: "No frames emitted from transcode pipeline. Check GPU resources."

  - alert: WebRtcEgressDown
    expr: vms_sfu_egress_active == 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "WebRTC Egress Down"
      description: "Zero active SFU egresses. Check connectivity to SFU (port 8085)."
