storage:
  volumes:
    - id: "vol-hot-1"
      path: "./data/recordings/hot"
      tier: "hot"
      priority: 1
      max_usage_percent: 85.0
      reserved_free_gb: 5.0
      enabled: true

    - id: "vol-warm-1"
      path: "./data/recordings/warm"
      tier: "warm"
      priority: 2
      max_usage_percent: 90.0
      reserved_free_gb: 10.0
      enabled: true

  quotas:
    tenant_limits:
      "tenant-alpha": 1000.0 # GB
      "tenant-beta": 500.0
    site_limits:
      "site-hqusa": 500.0 # GB

  alerts:
    warn_at_percent: 75.0
    crit_at_percent: 85.0
    check_interval_seconds: 60
