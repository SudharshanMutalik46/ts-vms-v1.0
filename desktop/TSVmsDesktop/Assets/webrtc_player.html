<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #171717; overflow: hidden; }
    #video { width: 100%; height: 100%; object-fit: contain; display: block; background: #171717; }
    #status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #F2F2F2;
      background: rgba(30, 31, 34, 0.92);
      border: 1px solid #4A4A4F;
      border-radius: 14px;
      padding: 12px 16px;
      font-family: sans-serif;
      font-size: 12px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
<video id="video" autoplay playsinline muted style="display:none"></video>
<div id="status">Connecting WebRTC…</div><script>
const p = %%PARAMS%%;
const sfuUrl         = p.sfuUrl;
const cameraId       = p.cameraId;
const sessionId      = p.sessionId;
const token          = p.token;
const preferredCodec = normalizeCodecName(p.preferredCodec || '');
const signalingTimeoutMs = p.timeoutMs || 10000;
const firstFrameTimeoutMs = Math.max(p.trackTimeoutMs || 45000, 45000);

const STATUS = document.getElementById('status');
const VIDEO  = document.getElementById('video');
VIDEO.autoplay = true;
VIDEO.muted = true;
VIDEO.playsInline = true;
VIDEO.controls = false;
const H = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };

let _pc = null;
let _signalingTimer = null;
let _frameTimer = null;
let _statsTimer = null;
let _done = false;
let _firstFrameArmed = false;

function postMsg(obj) {
  try { window.chrome.webview.postMessage(JSON.stringify(obj)); } catch (_) {}
}

function debug(msg, extra) {
  postMsg({ type: 'webrtc-debug', message: msg, extra });
}

function setStatus(msg) {
  STATUS.textContent = msg;
}

function clearTimers() {
  if (_signalingTimer) clearTimeout(_signalingTimer);
  if (_frameTimer) clearTimeout(_frameTimer);
  if (_statsTimer) clearInterval(_statsTimer);
  _signalingTimer = null;
  _frameTimer = null;
  _statsTimer = null;
}

function cleanupPc() {
  try {
    if (_pc) {
      _pc.ontrack = null;
      _pc.oniceconnectionstatechange = null;
      _pc.onconnectionstatechange = null;
      _pc.onicegatheringstatechange = null;
      _pc.close();
    }
  } catch (_) {}
  _pc = null;
}

function fail(reason) {
  if (_done) return;
  _done = true;
  clearTimers();
  cleanupPc();
  setStatus('WebRTC failed: ' + reason);
  postMsg({ type: 'webrtc-failed', reason });
  debug('fail', reason);
}

function success(codec) {
  if (_done) return;
  _done = true;
  clearTimers();
  STATUS.style.display = 'none';
  VIDEO.style.display = 'block';
  postMsg({ type: 'webrtc-connected', codec });
  debug('success', codec);
}

function hasRenderableFrame() {
  return (
    VIDEO.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
    VIDEO.videoWidth > 0 &&
    VIDEO.videoHeight > 0 &&
    !VIDEO.paused &&
    !VIDEO.ended
  );
}

function getDecodedFrameCount() {
  try {
    if (typeof VIDEO.getVideoPlaybackQuality === 'function') {
      const quality = VIDEO.getVideoPlaybackQuality();
      if (quality && Number.isFinite(quality.totalVideoFrames)) {
        return Number(quality.totalVideoFrames);
      }
    }
  } catch (_) {}

  const webkitFrames = Number(VIDEO.webkitDecodedFrameCount);
  return Number.isFinite(webkitFrames) ? webkitFrames : 0;
}

function getRenderedFrameCount() {
  try {
    if (typeof VIDEO.getVideoPlaybackQuality === 'function') {
      const quality = VIDEO.getVideoPlaybackQuality();
      if (quality && Number.isFinite(quality.totalVideoFrames)) {
        return Number(quality.totalVideoFrames);
      }
    }
  } catch (_) {}

  return getDecodedFrameCount();
}

function tryMarkReady(source) {
  if (_done) return;

  const rendered = hasRenderableFrame();
  const playbackFrames = getRenderedFrameCount();

  if (rendered && playbackFrames > 0) {
    debug('video-frame-ready', {
      source,
      playbackFrames,
      width: VIDEO.videoWidth,
      height: VIDEO.videoHeight,
      readyState: VIDEO.readyState
    });
    success(source);
    return true;
  }

  debug('frame-not-ready', {
    source,
    playbackFrames,
    width: VIDEO.videoWidth,
    height: VIDEO.videoHeight,
    readyState: VIDEO.readyState,
    paused: VIDEO.paused,
    ended: VIDEO.ended
  });
  return false;
}

let _lastStatsDump = 0;
async function detectInboundVideo(codec) {
  if (!_pc || _done) return false;

  try {
    const stats = await _pc.getStats();
    let foundInbound = false;
    const now = Date.now();
    for (const report of stats.values()) {
      if (report.type === 'inbound-rtp' && report.kind === 'video') {
        foundInbound = true;
        const bytes = Number(report.bytesReceived || 0);
        const framesDecoded = Number(report.framesDecoded || 0);
        const framesReceived = Number(report.framesReceived || 0);
        const rendered = hasRenderableFrame();
        const playbackFrames = getRenderedFrameCount();
        if (rendered && (framesDecoded > 0 || playbackFrames > 0 || framesReceived > 0)) {
          debug('inbound-video', {
            bytes,
            framesDecoded,
            framesReceived,
            playbackFrames,
            rendered,
            width: VIDEO.videoWidth,
            height: VIDEO.videoHeight,
            readyState: VIDEO.readyState
          });
          success(codec);
          return true;
        }
        // Log zero-bytes every 2s for diagnosis
        if (now - _lastStatsDump > 2000) {
          _lastStatsDump = now;
          debug('stats-zero', {
            ssrc: report.ssrc,
            bytes,
            framesDecoded,
            framesReceived,
            playbackFrames,
            packetsReceived: report.packetsReceived,
            rendered,
            width: VIDEO.videoWidth,
            height: VIDEO.videoHeight,
            readyState: VIDEO.readyState
          });
        }
      }
    }
    // Log if no inbound-rtp report at all
    if (!foundInbound && now - _lastStatsDump > 2000) {
      _lastStatsDump = now;
      const playbackFrames = getRenderedFrameCount();
      if (hasRenderableFrame() && playbackFrames > 0) {
        debug('playback-ready-no-inbound', {
          playbackFrames,
          width: VIDEO.videoWidth,
          height: VIDEO.videoHeight,
          readyState: VIDEO.readyState
        });
        success(codec);
        return true;
      }
      const types = [...stats.values()].map(r => r.type).join(',');
      debug('stats-no-inbound', { types, playbackFrames, width: VIDEO.videoWidth, height: VIDEO.videoHeight, readyState: VIDEO.readyState });
    }
  } catch (err) {
    debug('getStats-error', err?.message || String(err));
  }

  return false;
}

async function api(method, path, body) {
  const opts = { method, headers: H };
  if (body !== undefined) opts.body = JSON.stringify(body);

  const res = await fetch(sfuUrl + path, opts);
  if (!res.ok) {
    const txt = await res.text().catch(() => String(res.status));
    throw new Error('HTTP ' + res.status + ' ' + path + ': ' + txt.substring(0, 400));
  }

  const ct = res.headers.get('content-type') || '';
  return ct.includes('json') ? res.json() : null;
}

function extractDtls(sdp) {
  const fp = sdp.match(/a=fingerprint:(\S+)\s+(\S+)/);
  const setup = sdp.match(/a=setup:(\S+)/);
  if (!fp) return null;

  const s = setup ? setup[1] : 'actpass';
  // SFU answer is always a=setup:passive, so browser must be active (client).
  // actpass in the offer maps to 'client' (not 'auto') to avoid DTLS role conflict.
  const role = s === 'active' ? 'client' : s === 'passive' ? 'server' : 'client';
  return { role, fingerprints: [{ algorithm: fp[1], value: fp[2] }] };
}

function normalizeCodecName(v) {
  const s = String(v || '').toUpperCase();
  if (s.includes('H265') || s.includes('HEVC')) return 'H265';
  if (s.includes('H264')) return 'H264';
  if (s.includes('VP9')) return 'VP9';
  if (s.includes('VP8')) return 'VP8';
  return s;
}

function browserVideoCodecOrder() {
  const caps = RTCRtpReceiver.getCapabilities?.('video');
  const codecs = caps?.codecs || [];
  const out = [];

  for (const c of codecs) {
    const n = normalizeCodecName(c.mimeType || '');
    if ((n === 'H265' || n === 'H264') && !out.includes(n)) {
      out.push(n);
    }
  }

  if (!out.includes('H264')) out.push('H264');
  return out;
}

function routerHasCodec(routerCaps, codecName) {
  const want = normalizeCodecName(codecName);
  return (routerCaps?.codecs || []).some(c => normalizeCodecName(c.mimeType || '') === want);
}

function dedupeHeaderExtensions(exts) {
  const seen = new Set();
  return (exts || [])
    .filter(h => {
      const key = `video|${h.uri}|${h.preferredId || 1}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    })
    .map(h => ({
      kind: 'video',
      uri: h.uri,
      preferredId: h.preferredId || 1
    }));
}

function parseOfferVideoCaps(sdp) {
  const lines = sdp.split(/\r?\n/);
  const rtpmap = {};
  const fmtpMap = {};
  const extmaps = {};

  for (const line of lines) {
    let m;

    m = line.match(/^a=rtpmap:(\d+)\s+([^/\s]+)\/(\d+)(?:\/(\d+))?/i);
    if (m) {
      const pt = parseInt(m[1], 10);
      const codecName = m[2].toUpperCase();
      rtpmap[pt] = {
        pt,
        mimeType: 'video/' + codecName,
        codecName,
        clockRate: parseInt(m[3], 10),
        channels: m[4] ? parseInt(m[4], 10) : undefined
      };
      continue;
    }

    m = line.match(/^a=fmtp:(\d+)\s+(.*)/i);
    if (m) {
      const pt = parseInt(m[1], 10);
      const params = {};
      for (const part of m[2].split(';')) {
        const idx = part.indexOf('=');
        if (idx >= 0) {
          const k = part.slice(0, idx).trim();
          const v = part.slice(idx + 1).trim();
          params[k] = v;
        }
      }
      fmtpMap[pt] = params;
      continue;
    }

    m = line.match(/^a=extmap:(\d+)(?:\/\S+)?\s+(\S+)/);
    if (m) extmaps[m[2]] = parseInt(m[1], 10);
  }

  return { rtpmap, fmtpMap, extmaps };
}

function chooseH264Pm1Codec(offerCaps) {
  const { rtpmap, fmtpMap } = offerCaps;
  const targetProfiles = ['42e01f', '42c01f', '42e01e', '42c01e', '42001f', '420032', '4d001f', '640c1f', '64001f'];

  const entries = Object.values(rtpmap)
    .filter(c => normalizeCodecName(c.codecName) === 'H264')
    .map(c => {
      const params = fmtpMap[c.pt] || {};
      return {
        mimeType: c.mimeType,
        preferredPayloadType: c.pt,
        clockRate: c.clockRate,
        channels: c.channels,
        parameters: params,
        packetizationMode: Number(params['packetization-mode'] ?? 0),
        profileLevelId: String(params['profile-level-id'] || '').toLowerCase()
      };
    });

  for (const want of targetProfiles) {
    const exact = entries.find(e => e.packetizationMode === 1 && e.profileLevelId === want);
    if (exact) return exact;
  }

  return entries.find(e => e.packetizationMode === 1) || null;
}

function chooseCodecFromOffer(preferredCodec, offerCaps) {
  const want = normalizeCodecName(preferredCodec);

  if (want === 'H264') {
    return chooseH264Pm1Codec(offerCaps);
  }

  const { rtpmap, fmtpMap } = offerCaps;
  const entries = Object.values(rtpmap).filter(c => normalizeCodecName(c.codecName) === want);
  if (!entries.length) return null;

  const first = entries[0];
  return {
    mimeType: first.mimeType,
    preferredPayloadType: first.pt,
    clockRate: first.clockRate,
    channels: first.channels,
    parameters: fmtpMap[first.pt] || {}
  };
}

function buildConsumeCaps(routerCaps, offerCaps, preferredCodec) {
  const want = normalizeCodecName(preferredCodec);

  if (!routerHasCodec(routerCaps, want)) {
    throw new Error(`SFU router has no ${want} codec`);
  }

  if (want === 'H264') {
    const chosen = chooseH264Pm1Codec(offerCaps);
    if (!chosen) {
      throw new Error('Browser offer has no H264 packetization-mode=1 codec');
    }

    const chosenParams = Object.assign({}, chosen.parameters || {});
    chosenParams['packetization-mode'] = 1;
    chosenParams['level-asymmetry-allowed'] = 1;
    // Mediasoup matches H264 profiles strictly. The SFU bridge emits
    // constrained-baseline, so normalize the browser caps to the same profile
    // instead of preserving Chromium's baseline-only offer.
    chosenParams['profile-level-id'] = '42e01f';

    return {
      codecs: [{
        mimeType: 'video/H264',
        clockRate: chosen.clockRate,
        preferredPayloadType: chosen.preferredPayloadType,
        channels: chosen.channels,
        parameters: chosenParams,
        rtcpFeedback: [
          { type: 'nack' },
          { type: 'nack', parameter: 'pli' }
        ]
      }],
      headerExtensions: dedupeHeaderExtensions(routerCaps.headerExtensions || [])
    };
  }

  const chosen = chooseCodecFromOffer(want, offerCaps);
  if (!chosen) throw new Error(`Browser offer has no ${want} codec`);

  return {
    codecs: [{
      mimeType: chosen.mimeType,
      clockRate: chosen.clockRate,
      preferredPayloadType: chosen.preferredPayloadType,
      channels: chosen.channels,
      parameters: chosen.parameters,
      rtcpFeedback: [
        { type: 'nack' },
        { type: 'nack', parameter: 'pli' }
      ]
    }],
    headerExtensions: dedupeHeaderExtensions(routerCaps.headerExtensions || [])
  };
}

function buildRemoteSdp(transport, consumer, offerExtmaps, consumeCaps) {
  const iceP = transport.iceParameters;
  const cands = transport.iceCandidates || [];
  const fp = transport.dtlsParameters.fingerprints[0];

  const rtpP = consumer.rtpParameters || {};
  const enc = (rtpP.encodings || [])[0] || {};
  const rtcp = rtpP.rtcp || {};

  const consumerCodec = (rtpP.codecs || [])[0];
  const offeredCodec = (consumeCaps?.codecs || [])[0];
  const chosen = consumerCodec || offeredCodec;
  if (!chosen) throw new Error('No negotiated video codec available for remote SDP');

  const pt =
    consumerCodec?.payloadType ??
    consumerCodec?.preferredPayloadType ??
    offeredCodec?.preferredPayloadType ??
    offeredCodec?.payloadType;
  if (pt === undefined || pt === null) {
    throw new Error('No negotiated payload type available for remote SDP');
  }

  const mime = String(chosen.mimeType || 'video/H264').split('/')[1];
  const clockRate = chosen.clockRate || 90000;
  const channels = chosen.channels;
  // Keep the SDP answer aligned with the SFU consumer metadata. The browser-side
  // consume-cap normalization already handles mediasoup's strict H264 matching;
  // the answer should not rewrite the negotiated codec parameters again.
  const params = Object.assign({}, offeredCodec?.parameters || {}, consumerCodec?.parameters || {});
  const rtcpFeedback = consumerCodec?.rtcpFeedback || offeredCodec?.rtcpFeedback || [];

  const firstCand = cands[0] || {};
  const ip = firstCand.ip || '0.0.0.0';
  const port = firstCand.port || 7;

  const candLines = cands.map(c => {
    let line =
      `a=candidate:${c.foundation} ${c.component || 1} ${(c.protocol || 'udp').toUpperCase()} ` +
      `${c.priority} ${c.ip} ${c.port} typ ${c.type}`;
    if (c.tcpType) line += ` tcptype ${c.tcpType}`;
    return line;
  }).join('\r\n');

  let rtpmap = `a=rtpmap:${pt} ${mime}/${clockRate}`;
  if (channels && channels > 1) rtpmap += `/${channels}`;

  let fmtp = '';
  const paramEntries = Object.entries(params);
  if (paramEntries.length) {
    fmtp = `\r\na=fmtp:${pt} ` + paramEntries.map(([k, v]) => `${k}=${v}`).join(';');
  }

  const fbLines = (rtcpFeedback.map(fb => {
    return fb.parameter
      ? `a=rtcp-fb:${pt} ${fb.type} ${fb.parameter}`
      : `a=rtcp-fb:${pt} ${fb.type}`;
  })).join('\r\n');

  const extLines = (rtpP.headerExtensions || [])
    .filter(x => offerExtmaps && offerExtmaps[x.uri] !== undefined)
    .map(x => `a=extmap:${offerExtmaps[x.uri]} ${x.uri}`)
    .join('\r\n');

  const ssrc = enc.ssrc;
  const cname = rtcp.cname || enc.cname || (ssrc ? `video-${ssrc}` : 'video-cname');
  const msid = 'mediasoup video0';

  const ssrcLines = ssrc
    ? [
        `a=ssrc:${ssrc} cname:${cname}`,
        `a=ssrc:${ssrc} msid:${msid}`
      ].join('\r\n')
    : '';

  return [
    'v=0',
    'o=mediasoup-server 10000 1 IN IP4 0.0.0.0',
    's=mediasoup',
    't=0 0',
    'a=group:BUNDLE 0',
    'a=msid-semantic: WMS *',
    `m=video ${port} UDP/TLS/RTP/SAVPF ${pt}`,
    `c=IN IP4 ${ip}`,
    'a=mid:0',
    'a=extmap-allow-mixed',
    `a=ice-ufrag:${iceP.usernameFragment}`,
    `a=ice-pwd:${iceP.password}`,
    'a=ice-options:renomination',
    `a=fingerprint:${fp.algorithm} ${fp.value}`,
    'a=setup:passive',
    'a=sendonly',
    'a=rtcp-mux',
    'a=rtcp-rsize',
    `a=msid:${msid}`,
    rtpmap + fmtp,
    fbLines || '',
    extLines || '',
    candLines || '',
    'a=end-of-candidates',
    ssrcLines || ''
  ].filter(Boolean).join('\r\n') + '\r\n';
}

function armFirstFrameHandlers(codec) {
  if (_firstFrameArmed) return;
  _firstFrameArmed = true;

  VIDEO.addEventListener('loadedmetadata', () => {
    debug('loadedmetadata', {
      width: VIDEO.videoWidth,
      height: VIDEO.videoHeight,
      readyState: VIDEO.readyState
    });
    tryMarkReady('loadedmetadata');
  }, { once: true });
  VIDEO.addEventListener('loadeddata', () => tryMarkReady('loadeddata'), { once: true });
  VIDEO.addEventListener('playing', () => tryMarkReady('playing'), { once: true });
  VIDEO.addEventListener('canplay', () => tryMarkReady('canplay'), { once: true });
  VIDEO.addEventListener('resize', () => {
    debug('video-resize', {
      width: VIDEO.videoWidth,
      height: VIDEO.videoHeight,
      readyState: VIDEO.readyState
    });
    tryMarkReady('resize');
  }, { once: true });
  VIDEO.addEventListener('waiting', () => debug('video-waiting', {
    readyState: VIDEO.readyState,
    width: VIDEO.videoWidth,
    height: VIDEO.videoHeight
  }), { once: true });
  VIDEO.addEventListener('stalled', () => debug('video-stalled', {
    readyState: VIDEO.readyState,
    width: VIDEO.videoWidth,
    height: VIDEO.videoHeight
  }), { once: true });
  VIDEO.addEventListener('error', () => debug('video-error', {
    code: VIDEO.error?.code || null,
    message: VIDEO.error?.message || null,
    readyState: VIDEO.readyState
  }), { once: true });

  if (typeof VIDEO.requestVideoFrameCallback === 'function') {
    VIDEO.requestVideoFrameCallback(() => tryMarkReady('requestVideoFrameCallback'));
  }

  _statsTimer = setInterval(() => {
    detectInboundVideo(codec).catch(() => {});
  }, 500);

  _frameTimer = setTimeout(() => {
    if (!hasRenderableFrame()) {
      detectInboundVideo(codec).then(ok => {
        if (!ok) fail('First frame timeout');
      }).catch(() => fail('First frame timeout'));
    }
  }, firstFrameTimeoutMs);
}

async function createWebRtcTransport() {
  return await api('POST', `/rooms/${cameraId}/transports/webrtc`, {});
}

async function connectOnce(preferredCodec) {
  setStatus(`Trying WebRTC (${preferredCodec})…`);
  debug('attempt-start', preferredCodec);

  _signalingTimer = setTimeout(() => fail('Signaling timeout'), signalingTimeoutMs);

  await api('POST', `/rooms/${cameraId}/join`, {
    sessionId,
    codecPreferences: [preferredCodec]
  });

  const routerCaps = await api('GET', `/rooms/${cameraId}/rtp-capabilities`);

  let negotiatedCodec = preferredCodec;
  if (!routerHasCodec(routerCaps, negotiatedCodec)) {
    const fallbackCodec = ['H264', 'H265'].find(c => routerHasCodec(routerCaps, c));
    if (!fallbackCodec) {
      throw new Error(`SFU router has no supported codec for requested ${preferredCodec}`);
    }
    debug('codec-fallback', { requested: preferredCodec, selected: fallbackCodec });
    negotiatedCodec = fallbackCodec;
  }

  const transport = await createWebRtcTransport();
  const pc = new RTCPeerConnection({ bundlePolicy: 'max-bundle', rtcpMuxPolicy: 'require' });
  _pc = pc;

  pc.addTransceiver('video', { direction: 'recvonly' });

  pc.oniceconnectionstatechange = () => debug('iceConnectionState', pc.iceConnectionState);
  pc.onconnectionstatechange = () => debug('connectionState', pc.connectionState);
  pc.onicegatheringstatechange = () => debug('iceGatheringState', pc.iceGatheringState);

  pc.ontrack = (e) => {
    debug('ontrack', { kind: e.track?.kind, muted: e.track?.muted });
    const stream = (e.streams && e.streams[0]) ? e.streams[0] : new MediaStream([e.track]);
    VIDEO.srcObject = stream;
    VIDEO.style.display = 'block';
    STATUS.style.display = 'block';
    setStatus(`WebRTC connected, waiting for first frame (${negotiatedCodec})...`);

    if (e.track) {
      e.track.onunmute = () => {
        debug('track-unmute', e.track.kind);
        tryMarkReady('track-unmute');
      };
      e.track.onmute = () => debug('track-mute', e.track.kind);
      e.track.onended = () => debug('track-ended', e.track.kind);
    }

    armFirstFrameHandlers(negotiatedCodec);

    const tryPlay = () => VIDEO.play().then(() => {
      if (_done) return;
      debug('video-play-ok');
    }).catch(err => {
      if (_done) return;
      debug('video-play-retry', err?.message || String(err));
    });

    tryPlay();
    setTimeout(() => {
      if (!_done && VIDEO.srcObject) {
        tryPlay();
      }
    }, 750);
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  const dtlsParams = extractDtls(offer.sdp);
  if (!dtlsParams) throw new Error('No DTLS fingerprint in local SDP');

  await api('POST', `/rooms/${cameraId}/transports/${transport.id}/connect`, { dtlsParameters: dtlsParams });

  const offerCaps = parseOfferVideoCaps(offer.sdp || '');
  const consumeRtpCaps = buildConsumeCaps(routerCaps, offerCaps, negotiatedCodec);

  const consumer = await api(
    'POST',
    `/rooms/${cameraId}/transports/${transport.id}/consume`,
    { rtpCapabilities: consumeRtpCaps }
  );

  const remoteSdp = buildRemoteSdp(transport, consumer, offerCaps.extmaps, consumeRtpCaps);
  await pc.setRemoteDescription({ type: 'answer', sdp: remoteSdp });
  debug('remote-desc-set', {
    transceivers: pc.getTransceivers().map(t => ({
      mid: t.mid,
      direction: t.direction,
      currentDirection: t.currentDirection,
      receiverKind: t.receiver?.track?.kind || null,
      receiverState: t.receiver?.track?.readyState || null
    }))
  });

  await api(
    'POST',
    `/rooms/${cameraId}/transports/${transport.id}/consumers/${consumer.id}/resume`,
    {}
  );

  clearTimeout(_signalingTimer);
  _signalingTimer = null;
  debug('signaling-complete', negotiatedCodec);
}

async function connect() {
  let attempts;
  if (preferredCodec === 'H265' || preferredCodec === 'H264') {
    attempts = [preferredCodec];
  } else {
    attempts = browserVideoCodecOrder().filter(c => c === 'H265' || c === 'H264');
  }
  let lastErr = null;

  for (const codec of attempts) {
    try {
      cleanupPc();
      clearTimers();
      _firstFrameArmed = false;
      VIDEO.srcObject = null;
      VIDEO.style.display = 'none';
      STATUS.style.display = 'block';
      await connectOnce(codec);
      return;
    } catch (e) {
      lastErr = e;
      debug('attempt-failed', { codec, error: e?.message || String(e) });
      cleanupPc();
      clearTimers();
    }
  }

  fail(lastErr?.message || 'All codec attempts failed');
}

connect().catch(e => fail(e.message || String(e)));
</script>
